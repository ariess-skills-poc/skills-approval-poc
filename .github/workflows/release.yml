# Tags every skill whose metadata.version changed in this push: <name>--v<version>.
#
# REQUIRED REPO SETTINGS (otherwise review can be bypassed):
# - Branch protection / ruleset on main: pull request required, code-owner review,
#   status check "validate" required, no bypass for admins.
# - Tag ruleset on pattern "*--v*": restrict creation, update and deletion; the only
#   bypass actor is the identity this workflow runs as (the GitHub Actions app, or the
#   release GitHub App if you switch to an app token). Without it, anyone with write
#   access can tag an unreviewed commit as a release.
name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Tag new skill versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python .github/scripts/release.py "${{ github.event.before }}" "${{ github.sha }}" --push
